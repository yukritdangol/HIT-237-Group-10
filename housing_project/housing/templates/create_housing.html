<!DOCTYPE html>
<html>

<head>

    <title>Create Housing</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            margin: 0;
            padding: 0;
        }

        .container {

            width: 500px;

            margin: 60px auto;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        }

        h1 {

            text-align: center;

            color: #2f4358;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            margin-bottom: 20px;

            border-radius: 6px;

            border: 1px solid #ccc;
        }

        button {

            width: 100%;

            padding: 14px;

            background-color: #2f4358;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }

        .error {

            color: red;

            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Create Housing Listing</h1>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="title"
                placeholder="Housing Title"
                required
            >

            <select name="location">

                {% for location in locations %}

                    <option value="{{ location.id }}">
                        {{ location.name }}
                    </option>

                {% endfor %}

            </select>

            <input
                type="number"
                name="price"
                placeholder="Price"
                required
            >

            <textarea
                name="description"
                placeholder="Description"
            ></textarea>

            <button type="submit">
                Create Listing
            </button>

        </form>

    </div>

</body>

</html>
