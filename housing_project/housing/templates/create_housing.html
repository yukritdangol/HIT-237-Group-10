{% extends 'base.html' %}

{% block content %}

<style>

    .container {

        width: 550px;

        margin: 50px auto;

        background-color: white;

        padding: 35px;

        border-radius: 12px;

        box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
    }

    h1 {

        text-align: center;

        color: #2f4358;

        margin-bottom: 30px;
    }

    input,
    textarea,
    select {

        width: 100%;

        padding: 14px;

        margin-top: 10px;

        margin-bottom: 20px;

        border-radius: 8px;

        border: 1px solid #ccc;

        font-size: 15px;

        box-sizing: border-box;
    }

    textarea {

        min-height: 120px;

        resize: vertical;
    }

    button {

        width: 100%;

        padding: 14px;

        background-color: #2f4358;

        color: white;

        border: none;

        border-radius: 8px;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {

        background-color: #3d5672;
    }

    .error {

        background-color: #ffe6e6;

        color: #c0392b;

        padding: 12px;

        border-radius: 8px;

        margin-bottom: 20px;

        text-align: center;
    }

</style>

<div class="container">

    <h1>Create Housing Listing</h1>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="title"
            placeholder="Housing Title"
            required
        >

        <select name="location">

            {% for location in locations %}

                <option value="{{ location.id }}">
                    {{ location.name }}
                </option>

            {% endfor %}

        </select>

        <input
            type="number"
            name="price"
            placeholder="Price"
            required
        >

        <textarea
            name="description"
            placeholder="Description"
        ></textarea>

        <button type="submit">
            Create Listing
        </button>

    </form>

</div>

{% endblock %}
