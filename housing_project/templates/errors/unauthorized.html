<!DOCTYPE html>
<html>

<head>

    <title>Unauthorized Access</title>

    <style>

        body {

            background-color: #f4f4f4;

            font-family: Arial, sans-serif;

            text-align: center;

            padding-top: 100px;
        }

        .box {

            background-color: white;

            width: 500px;

            margin: auto;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        }

        h1 {

            color: #c0392b;
        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background-color: #2f4358;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>403 Unauthorized</h1>

        <p>{{ error }}</p>

        <a href="/accounts/dashboard/">
            Return Home
        </a>

    </div>

</body>

</html>
