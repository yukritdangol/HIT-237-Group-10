<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
        }

        .navbar {
            background-color: #2f4358;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 42px;
        }

        .login-container {

            width: 400px;

            margin: 80px auto;

            background-color: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2f4358;
        }

        form p {
            display: flex;
            flex-direction: column;
        }

        input {

            padding: 12px;

            margin-top: 8px;

            margin-bottom: 18px;

            border-radius: 6px;

            border: 1px solid #ccc;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            background-color: #2f4358;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #3d5672;
        }

        .signup-link {

            margin-top: 20px;

            text-align: center;
        }

        .signup-link a {

            text-decoration: none;

            color: #2f4358;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">
        <h1>Remote Housing Crisis</h1>
    </div>

    <div class="login-container">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="/accounts/signup/">
                Register
            </a>
        </div>

    </div>

</body>

</html>
