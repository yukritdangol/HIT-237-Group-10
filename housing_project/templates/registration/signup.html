{% extends 'base.html' %}

{% block content %}

<style>

    .signup-container {

        width: 520px;

        margin: 50px auto;

        background-color: white;

        padding: 40px;

        border-radius: 12px;

        box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
    }

    h2 {

        text-align: center;

        margin-bottom: 30px;

        color: #2f4358;
    }

    form p {

        display: flex;

        flex-direction: column;
    }

    input,
    select {

        padding: 12px;

        margin-top: 8px;

        margin-bottom: 18px;

        border-radius: 6px;

        border: 1px solid #ccc;

        font-size: 15px;
    }

    button {

        width: 100%;

        padding: 14px;

        background-color: #2f4358;

        color: white;

        border: none;

        border-radius: 8px;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {

        background-color: #3d5672;
    }

    .login-link {

        margin-top: 20px;

        text-align: center;
    }

    .login-link a {

        text-decoration: none;

        color: #2f4358;

        font-weight: bold;
    }

</style>

<div class="signup-container">

    <h2>Create Account</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/accounts/login/">
            Login
        </a>

    </div>

</div>

{% endblock %}
